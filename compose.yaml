name: gamestackr-tcg

x-app: &app
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        args:
            DOCKER_UID: ${DOCKER_UID:-1000}
            DOCKER_GID: ${DOCKER_GID:-1000}
    image: gamestackr-tcg-app:dev
    working_dir: /var/www/html
    init: true
    volumes:
        - .:/var/www/html

services:
    garage:
        image: dxflrs/garage:v2.4.0
        command: ['/garage', '-c', '/etc/garage/garage.toml', 'server']
        restart: unless-stopped
        volumes:
            - ./storage/app/private/garage:/etc/garage:ro
            - garage-data:/var/lib/garage/data
            - garage-meta:/var/lib/garage/meta
        ports:
            - '127.0.0.1:${GARAGE_API_PORT:-3900}:3900'
            - '127.0.0.1:${GARAGE_WEB_PORT:-3902}:3902'
        healthcheck:
            test: ['CMD', '/garage', '-c', '/etc/garage/garage.toml', 'status']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s

    garage-webui:
        image: khairul169/garage-webui:1.1.0
        restart: unless-stopped
        volumes:
            - ./storage/app/private/garage:/etc/garage:ro
        env_file:
            - path: ./storage/app/private/garage/webui.env
              required: false
              format: raw
        environment:
            CONFIG_PATH: /etc/garage/garage.toml
            API_BASE_URL: http://garage:3903
            S3_ENDPOINT_URL: http://garage:3900
        ports:
            - '127.0.0.1:${GARAGE_UI_PORT:-3909}:3909'
        depends_on:
            garage:
                condition: service_healthy

    app:
        <<: *app
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:8000'
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '--fail',
                    '--silent',
                    'http://localhost:8000/up',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    vite:
        <<: *app
        command: npm run dev -- --host 0.0.0.0
        environment:
            VITE_PORT: ${VITE_PORT:-5173}
        ports:
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl --fail --silent http://localhost:$${VITE_PORT}/@vite/client > /dev/null',
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 15s

    queue:
        <<: *app
        command: php artisan queue:work --tries=3 --timeout=90
        stop_grace_period: 100s
        depends_on:
            app:
                condition: service_healthy

    postgres:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: ${DB_DATABASE:-gamestackr}
            POSTGRES_USER: ${DB_USERNAME:-gamestackr}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
        ports:
            - '127.0.0.1:${DB_FORWARD_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init-testing.sql:/docker-entrypoint-initdb.d/10-testing.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 12

    mailpit:
        image: axllent/mailpit:v1.30
        ports:
            - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

volumes:
    postgres-data:
    garage-data:
    garage-meta:
