name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Application
        run: make init

      - name: Run CI Checks
        run: make check

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: make down
